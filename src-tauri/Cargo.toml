[package]
name = "nowtree"
version = "1.1.7"
description = "NowTree - 个人事务管理系统"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# 1.1.7：应用内检查更新。
# updater 负责「拉 latest.json → 校验签名 → 下载安装包 → 安装」。
# 不额外引 tauri-plugin-process：Windows 安装器的 InstallOptions.restartAfterInstall 默认 true，
# 装完会自己把应用重新拉起来，前端不需要 relaunch()。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] } # 0.1.19：sync_id 生成

# 1.1.5：提醒窗口需要「显示但不抢焦点」——直接用 Win32 ShowWindow(SW_SHOWNOACTIVATE)，
# 因为 tao 的 Window::show() 在首次显示之后会走 SW_SHOW（可能激活窗口）。
[target.'cfg(windows)'.dependencies]
# 1.1.7：Win32_System_Registry 供 get_system_theme 读 AppsUseLightTheme（WebView2 的
# prefers-color-scheme 在 Tauri 里不可信，见 commands.rs 注释）。
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 同时产出「库 crate (nowtree_lib)」与「二进制 (nowtree)」。
# main.rs 调用 nowtree_lib::run()，故必须显式声明 lib 名称。
[lib]
name = "nowtree_lib"
path = "src/lib.rs"

[[bin]]
name = "NowTree"
path = "src/main.rs"
